name: Deploy docs

on: 
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci

      - name: Remove old storybook build
        run: rm -rf packages/docs/storybook-static
      
      - run: npm run build
        env:
          TURBO_TOKEN: kqTQKsfG2KWDh9WSdD93lNxW
          TURBO_TEAM: 'adonis-amarantes-projects'

      - name: Add .nojekyll
        run: touch packages/docs/storybook-static/.nojekyll

      - name: Deploy storybook
        working-directory: ./packages/docs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: npm run deploy-storybook -- --ci --existing-output-dir=storybook-static
